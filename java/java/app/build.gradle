apply plugin: 'com.android.application'

android {
    compileSdkVersion 26
    buildToolsVersion '27.0.3'
    defaultConfig {
        applicationId "com.ideabonyan.iranapp"
        minSdkVersion 15
        targetSdkVersion 26
        versionCode 104
        versionName "1.1.104"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
        disable "Instantiatable"
        disable 'MissingTranslation', 'ExtraTranslation'
        useLibrary 'org.apache.http.legacy'
    }
}

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')
    androidTestCompile('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    compile files('libs/httpcore-4.3-beta1.jar')
    //all three are required for image slider
    compile('org.apache.httpcomponents:httpmime:4.3') {
        exclude module: "httpclient"
    }

//    compile 'com.github.lovetuzitong:MultiImageSelector:1.2'
//    compile project(':MultiImageSelector')
    implementation project(path: ':MultiImageSelector')
    implementation 'com.squareup.retrofit2:retrofit:2.3.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.android.support:appcompat-v7:26.1.0'
//    implementation 'com.android.support.constraint:constraint-layout:1.0.1'
    implementation 'com.android.support:cardview-v7:26.1.0'
    implementation 'com.android.support:support-v4:26.1.0'
    implementation 'com.android.support:design:26.1.0'
    implementation 'de.hdodenhof:circleimageview:2.1.0'
    implementation 'com.android.volley:volley:1.1.1'
    implementation 'com.google.firebase:firebase-core:11.0.2'
    implementation 'com.google.firebase:firebase-messaging:11.0.2'
    implementation 'com.daimajia.slider:library:1.1.5@aar'
    implementation 'com.nineoldandroids:library:2.4.0'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.google.android.gms:play-services-maps:11.0.2'
    implementation 'com.google.android.gms:play-services-location:11.0.2'
    implementation 'me.zhanghai.android.materialratingbar:library:1.0.2'
    implementation 'com.github.developer-shivam:Crescento:1.2.0'
    implementation 'com.theartofdev.edmodo:android-image-cropper:2.4.+'
    implementation 'com.joooonho:selectableroundedimageview:1.0.1'
    implementation 'com.github.XunMengWinter:CircularAnim:0.3.4'
    implementation 'uk.co.samuelwall:material-tap-target-prompt:2.4.1'
    testCompile 'junit:junit:4.12'
    implementation  'com.github.delight-im:Android-SimpleLocation:v1.0.1'
}


apply plugin: 'com.google.gms.google-services'
