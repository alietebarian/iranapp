apply plugin: 'com.android.application'

android {
    namespace 'com.ideabonyan.iranapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.ideabonyan.iranapp"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 104
        versionName "1.1.104"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
        disable 'Instantiatable'
        disable 'MissingTranslation', 'ExtraTranslation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        aidl true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // OkHttp (via Retrofit, below) handles the multipart uploads that used to go through
    // Apache HttpClient — no separate HTTP client dependency is needed any more.

    implementation project(path: ':MultiImageSelector')
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.transition:transition:1.5.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'de.hdodenhof:circleimageview:2.1.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'me.zhanghai.android.materialratingbar:library:1.0.2'
    implementation 'com.github.developer-shivam:Crescento:1.2.0'
    // NOTE: CanHub 4.x+ replaced the activity()/onActivityResult API used throughout this app
    // with Android's ActivityResultContracts. Pinned to the last 3.x release to keep today's
    // call sites working; migrating to the modern contract-based API is tracked for Phase A4/A5.
    implementation 'com.github.CanHub:Android-Image-Cropper:3.3.6'
    implementation 'com.joooonho:selectableroundedimageview:1.0.1'
    implementation 'com.github.XunMengWinter:CircularAnim:0.3.4'
    implementation 'uk.co.samuelwall:material-tap-target-prompt:2.4.1'
    testImplementation 'junit:junit:4.13.2'
    implementation  'com.github.delight-im:Android-SimpleLocation:v1.0.1'
}


apply plugin: 'com.google.gms.google-services'
